name: Probar fuentes desde GitHub
on: workflow_dispatch
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          curl -sS -m 40 -o p.html -w "prefectura %{http_code} %{time_total}s\n" https://contenidosweb.prefecturanaval.gob.ar/alturas/ || echo "prefectura FALLO"
          grep -c "PUERTO RUIZ" p.html || true
          curl -sS -m 40 -o m.json -w "metno %{http_code}\n" -A "campoentrerriano/1.0 github.com/cafferattasanti/campoentrerriano" "https://api.met.no/weatherapi/locationforecast/2.0/complete?lat=-33.1514&lon=-59.3188" || echo "metno FALLO"
          head -c 200 m.json; echo
          curl -sS -m 40 -o o.json -w "openmeteo %{http_code}\n" "https://api.open-meteo.com/v1/forecast?latitude=-33.15&longitude=-59.32&current=temperature_2m" || echo "openmeteo FALLO"
          head -c 200 o.json; echo
